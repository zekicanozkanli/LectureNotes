<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" width="100%" height="100%">
  <!-- Matrix Brackets -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="miter">
    <path d="M 257 90 H 245 V 340 H 257" />
    <path d="M 503 90 H 515 V 340 H 503" />
  </g>

  <!-- Equation Left-Hand Side -->
  <text x="180" y="223" font-family="Times New Roman, serif" font-size="28" fill="currentColor" text-anchor="end">
    <tspan font-style="italic">A</tspan>(<tspan font-style="italic">G</tspan>) =
  </text>

  <!-- Column Indices (Top) -->
  <g font-family="Times New Roman, serif" font-size="18" fill="currentColor" text-anchor="middle" opacity="0.85">
    <text x="280" y="68">1</text>
    <text x="330" y="68">2</text>
    <text x="380" y="68">3</text>
    <text x="430" y="68">4</text>
    <text x="480" y="68">5</text>
  </g>

  <!-- Row Indices (Left) -->
  <g font-family="Times New Roman, serif" font-size="18" fill="currentColor" text-anchor="middle" opacity="0.85">
    <text x="218" y="133">1</text>
    <text x="218" y="178">2</text>
    <text x="218" y="223">3</text>
    <text x="218" y="268">4</text>
    <text x="218" y="313">5</text>
  </g>

  <!-- Matrix Entries -->
  <g font-family="Times New Roman, serif" font-size="24" fill="currentColor" text-anchor="middle">
    <!-- Row 1 -->
    <text x="280" y="133">0</text>
    <text x="330" y="133">1</text>
    <text x="380" y="133">1</text>
    <text x="430" y="133">0</text>
    <text x="480" y="133">0</text>

    <!-- Row 2 -->
    <text x="280" y="178">1</text>
    <text x="330" y="178">0</text>
    <text x="380" y="178">1</text>
    <text x="430" y="178">1</text>
    <text x="480" y="178">0</text>

    <!-- Row 3 -->
    <text x="280" y="223">1</text>
    <text x="330" y="223">1</text>
    <text x="380" y="223">0</text>
    <text x="430" y="223">1</text>
    <text x="480" y="223">0</text>

    <!-- Row 4 -->
    <text x="280" y="268">0</text>
    <text x="330" y="268">1</text>
    <text x="380" y="268">1</text>
    <text x="430" y="268">0</text>
    <text x="480" y="268">1</text>

    <!-- Row 5 -->
    <text x="280" y="313">0</text>
    <text x="330" y="313">0</text>
    <text x="380" y="313">0</text>
    <text x="430" y="313">1</text>
    <text x="480" y="313">0</text>
  </g>
</svg>
