<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
<title id="title">Intersection graph of three fruit sets</title>
<desc id="desc">Three vertices v_A, v_B, and v_C form a path. The edge from v_A to v_B corresponds to the shared banana. The edge from v_B to v_C corresponds to the shared orange. A and C have no shared element, so there is no edge between them.</desc>
<rect width="900" height="210" rx="14" fill="#ffffff"/>
<g stroke="#334155" stroke-width="3" fill="none"><path d="M 182 84 H 428"/><path d="M 472 84 H 718"/></g>
<g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569"><text x="305" y="59">banana</text><text x="595" y="59">orange</text></g>
<g fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"><circle cx="160" cy="84" r="22"/><circle cx="450" cy="84" r="22"/><circle cx="740" cy="84" r="22"/></g>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#1e293b" font-size="21"><text x="160" y="90">v<tspan baseline-shift="sub" font-size="13">A</tspan></text><text x="450" y="90">v<tspan baseline-shift="sub" font-size="13">B</tspan></text><text x="740" y="90">v<tspan baseline-shift="sub" font-size="13">C</tspan></text></g>
<g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1e293b"><text x="160" y="146">A = {apple, banana}</text><text x="450" y="146">B = {banana, orange}</text><text x="740" y="146">C = {orange, pineapple}</text></g>
<text x="450" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Each vertex represents one entire set.</text>
</svg>
