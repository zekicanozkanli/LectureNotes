<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc">
<title id="title">Disjoint union of unlabeled W4 and P3</title>
<desc id="desc">Two disjoint components with unlabeled vertices. W4 consists of a triangle and a central vertex adjacent to all three triangle vertices. P3 is a three-vertex path. There are seven vertices and eight edges in total.</desc>
<rect width="680" height="330" fill="white"/>
<g stroke="#24364b" stroke-width="2.6" stroke-linecap="round">
<line x1="170" y1="80" x2="70" y2="265"/>
<line x1="170" y1="80" x2="270" y2="265"/>
<line x1="170" y1="80" x2="170" y2="203"/>
<line x1="70" y1="265" x2="270" y2="265"/>
<line x1="70" y1="265" x2="170" y2="203"/>
<line x1="270" y1="265" x2="170" y2="203"/>
<line x1="390" y1="180" x2="485" y2="180"/>
<line x1="485" y1="180" x2="580" y2="180"/>
</g><g fill="white" stroke="#24364b" stroke-width="2.6">
<circle cx="170" cy="80" r="7"/>
<circle cx="70" cy="265" r="7"/>
<circle cx="270" cy="265" r="7"/>
<circle cx="170" cy="203" r="7"/>
<circle cx="390" cy="180" r="7"/>
<circle cx="485" cy="180" r="7"/>
<circle cx="580" cy="180" r="7"/>
</g><g font-family="Georgia,serif" font-size="25" text-anchor="middle" fill="#24364b">
<text x="340" y="38">W<tspan baseline-shift="sub" font-size="17">4</tspan><tspan baseline-shift="baseline"> ∪ P</tspan><tspan baseline-shift="sub" font-size="17">3</tspan></text>
<text x="170" y="311">W<tspan baseline-shift="sub" font-size="17">4</tspan></text>
<text x="485" y="311">P<tspan baseline-shift="sub" font-size="17">3</tspan></text></g></svg>
