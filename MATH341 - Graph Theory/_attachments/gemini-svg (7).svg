<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="130" y1="130" x2="310" y2="130" />
    <line x1="310" y1="130" x2="550" y2="130" />
    <line x1="130" y1="130" x2="130" y2="310" />
    <line x1="310" y1="130" x2="310" y2="310" />
    <line x1="130" y1="310" x2="310" y2="310" />
    <line x1="130" y1="310" x2="310" y2="130" />
    <line x1="550" y1="130" x2="550" y2="310" />
  </g>

  <g fill="currentColor">
    <circle cx="130" cy="130" r="6" />
    <circle cx="310" cy="130" r="6" />
    <circle cx="550" cy="130" r="6" />
    <circle cx="130" cy="310" r="6" />
    <circle cx="310" cy="310" r="6" />
    <circle cx="550" cy="310" r="6" />
  </g>

  <g font-family="Times New Roman, serif" font-size="22" fill="currentColor" text-anchor="middle">
    <text x="130" y="85">
      <tspan font-style="italic">d</tspan>(<tspan font-style="italic">v</tspan><tspan font-size="15" baseline-shift="sub">1</tspan>) = 2
    </text>
    <text x="310" y="85">
      <tspan font-style="italic">d</tspan>(<tspan font-style="italic">v</tspan><tspan font-size="15" baseline-shift="sub">2</tspan>) = 4
    </text>
    <text x="550" y="85">
      <tspan font-style="italic">d</tspan>(<tspan font-style="italic">v</tspan><tspan font-size="15" baseline-shift="sub">3</tspan>) = 2
    </text>

    <text x="130" y="360">
      <tspan font-style="italic">d</tspan>(<tspan font-style="italic">v</tspan><tspan font-size="15" baseline-shift="sub">4</tspan>) = 3
    </text>
    <text x="310" y="360">
      <tspan font-style="italic">d</tspan>(<tspan font-style="italic">v</tspan><tspan font-size="15" baseline-shift="sub">5</tspan>) = 2
    </text>
    <text x="550" y="360">
      <tspan font-style="italic">d</tspan>(<tspan font-style="italic">v</tspan><tspan font-size="15" baseline-shift="sub">6</tspan>) = 1
    </text>
  </g>
</svg>
