<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="100%" height="100%">
  <!-- Graph Edges -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="180" y1="300" x2="130" y2="160" />
    <line x1="130" y1="160" x2="280" y2="80" />
    <line x1="180" y1="300" x2="280" y2="80" />
    <line x1="180" y1="300" x2="420" y2="150" />
  </g>

  <!-- Graph Vertices -->
  <g fill="currentColor">
    <circle cx="180" cy="300" r="6" />
    <circle cx="130" cy="160" r="6" />
    <circle cx="280" cy="80" r="6" />
    <circle cx="420" cy="150" r="6" />
    <circle cx="450" cy="290" r="6" />
  </g>

  <!-- Node Labels -->
  <g font-family="Times New Roman, serif" font-size="24" fill="currentColor">
    <text x="160" y="335" text-anchor="end">1</text>
    <text x="105" y="168" text-anchor="end">2</text>
    <text x="280" y="52" text-anchor="middle">3</text>
    <text x="445" y="142" text-anchor="start">4</text>
    <text x="475" y="298" text-anchor="start">5</text>
  </g>
</svg>
