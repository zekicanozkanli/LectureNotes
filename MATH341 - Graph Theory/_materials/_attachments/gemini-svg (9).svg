<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <!-- Graph Edges -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="90" x2="110" y2="190" />
    <line x1="250" y1="90" x2="185" y2="320" />
    <line x1="250" y1="90" x2="315" y2="320" />
    <line x1="250" y1="90" x2="390" y2="190" />
  </g>

  <!-- Graph Vertices -->
  <g fill="currentColor">
    <circle cx="250" cy="90" r="6" />
    <circle cx="110" cy="190" r="6" />
    <circle cx="185" cy="320" r="6" />
    <circle cx="315" cy="320" r="6" />
    <circle cx="390" cy="190" r="6" />
  </g>

  <!-- Node Labels -->
  <g font-family="Times New Roman, serif" font-size="24" fill="currentColor">
    <text x="250" y="60" text-anchor="middle">1</text>
    <text x="80" y="198" text-anchor="end">2</text>
    <text x="185" y="362" text-anchor="middle">3</text>
    <text x="320" y="362" text-anchor="middle">4</text>
    <text x="420" y="198" text-anchor="start">5</text>
  </g>
</svg>
